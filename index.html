<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aonde está o Joédio?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/estilo.css">
</head>

<body>

  <div id="principal" class="container-fluid text-center">
    <h1>Aonde está o Joédio?</h1>
    <p>Tente adivinhar aonde está o Joédio sorridente.</p>

    <div id="linha1" class="row justify-content-center">
      <div id="0" class="game-box inicial" onclick="verifica(this)">0</div>
      <div id="1" class="game-box inicial" onclick="verifica(this)">1</div>
      <div id="2" class="game-box inicial" onclick="verifica(this)">2</div>
      <div id="3" class="game-box inicial" onclick="verifica(this)">3</div>
      <div id="4" class="game-box inicial" onclick="verifica(this)">4</div>
      <div id="5" class="game-box inicial" onclick="verifica(this)">5</div>
    </div>

    <div class="row justify-content-center" id="div1">
      <p id="resposta"></p>
      <button id="joganovamente" class="botao visivel">Jogar novamente</button>
      <button id="reiniciar" class="botao invisivel">Reiniciar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/jogo.js"></script>
</body>

</html>
