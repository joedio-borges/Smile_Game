<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gossip Girl: Where's the Secret?</title>
    <!-- Google Fonts: Importante para o tema feminino chic -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">
</head>

<body>

    <div id="principal" class="container-fluid py-5 text-center">
        <header class="mb-5">
            <h1 class="display-4">Spotted: <span class="highlight">O Segredo</span></h1>
            <p class="subtitle">Você sabe que me ama. Tente descobrir onde escondi o sorriso.</p>
            <small class="credits">Curated by: Joédio Borges Jr.</small>
        </header>
  
        <div id="linha1" class="row justify-content-center mb-4">
            <!-- Os IDs permanecem os mesmos para não quebrar seu JS -->
            <div id="0" class="inicial" onclick="verifica(this)">0</div>
            <div id="1" class="inicial" onclick="verifica(this)">1</div>
            <div id="2" class="inicial" onclick="verifica(this)">2</div>
            <div id="3" class="inicial" onclick="verifica(this)">3</div>
        </div>

        <div class="row justify-content-center mt-4" id="div1">
            <p id="resposta" class="fw-bold fs-4 mb-3"></p>
            <div class="d-flex justify-content-center gap-3">
                <button id="joganovamente" class="btn-gossip">Jogar Novamente</button>
                <button id="reiniciar" class="btn-gossip invisivel">Reiniciar</button>
            </div>
        </div>
    </div>

    <script src="./js/jogo.js"></script>
</body>
</html>
